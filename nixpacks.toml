[phases.setup]
nixPkgs = ["php84", "php84Extensions.pdo", "php84Extensions.pdo_mysql", "php84Extensions.mbstring", "php84Extensions.tokenizer", "php84Extensions.xml", "php84Extensions.ctype", "php84Extensions.fileinfo", "php84Extensions.openssl", "php84Extensions.curl", "php84Extensions.zip", "composer", "nodejs_20", "nodePackages.npm"]

[phases.build]
cmds = [
    "composer install --no-dev --optimize-autoloader --no-scripts",
    "npm ci --prefer-offline || npm install --no-audit",
    "npm run build"
]

[start]
cmd = "php artisan config:clear && php artisan migrate --force && php -S 0.0.0.0:$PORT -t public"